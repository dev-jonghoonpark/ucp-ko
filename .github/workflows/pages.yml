name: Deploy GitHub Pages

# 브랜치마다 한 버전을 빌드해 mike로 gh-pages 브랜치의 하위 경로에 배포한다.
#   main               -> /draft/
#   release/<version>  -> /<version>/  (LATEST_VERSION이면 /latest/ 별칭도 갱신)
# 이 파일은 main과 모든 release/* 브랜치에 같은 내용으로 둔다.

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

env:
  LATEST_VERSION: "2026-08-25"
  PAGES_URL: https://dev-jonghoonpark.github.io/ucp-ko/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Cache ucp-schema binary
        id: cache-ucp-schema
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ucp-schema
          key: ${{ runner.os }}-ucp-schema-1.4.1

      - name: Install ucp-schema
        if: steps.cache-ucp-schema.outputs.cache-hit != 'true'
        run: cargo install ucp-schema --version 1.4.1 --locked

      - name: Configure Git credentials
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin gh-pages:gh-pages || true

      - name: Build and deploy version
        env:
          DOCS_MODE: all
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          case "$GITHUB_REF_NAME" in
            main) VERSION=draft ;;
            release/*) VERSION="${GITHUB_REF_NAME#release/}" ;;
            *) echo "unsupported branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          export SITE_URL="${PAGES_URL}${VERSION}/"
          uv sync
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            uv run mike deploy --push --update-aliases "$VERSION" latest
            uv run mike set-default --push latest
          elif [ "$VERSION" = "draft" ]; then
            uv run mike deploy --push --title "draft (초안)" draft
          else
            uv run mike deploy --push "$VERSION"
          fi
